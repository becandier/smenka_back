[project]
name = "smenka-back"
version = "0.1.0"
description = "Smenka — API для учёта рабочего времени"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.14.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "sqladmin>=0.20.0",
    "httpx>=0.27.0",
    "bcrypt==4.2.1",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "structlog>=24.0.0",
    "psycopg2-binary>=2.9.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "fakeredis>=2.26.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99
# Авто-сгенерированные Alembic-миграции не линтуем.
extend-exclude = ["src/migrations"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade (современный синтаксис 3.12)
    "B",      # flake8-bugbear (вероятные баги)
    "A",      # flake8-builtins (затенение встроенных имён)
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async (блокирующие вызовы в async-коде)
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez (naive datetime запрещён — все timestamps UTC)
    "T20",    # flake8-print (print в проде запрещён — есть structlog)
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "RSE",    # flake8-raise (лишние скобки у raise)
    "ISC",    # implicit string concatenation
    "PIE",    # flake8-pie (misc-улучшения)
    "PERF",   # perflint (антипаттерны производительности)
    "RUF",    # специфичные правила ruff
    "S",      # flake8-bandit (security)
    "PGH",    # pygrep-hooks (blanket noqa / type: ignore без кода)
]
ignore = [
    # Конфликтует с ruff format (форматтер сам управляет конкатенацией строк)
    "ISC001",
    # Кириллица в строках/докстрингах/комментариях — язык проекта русский,
    # «похожие на латиницу» символы здесь не опечатка.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert — основа pytest
    "S105",   # «хардкод-пароли» в фикстурах тестов
    "S106",
]
# Синхронный bridge для Celery: asyncio.run / time.sleep здесь осознанны
"src/app/tasks/**" = ["ASYNC251"]
# CLI-скрипты: print — штатный вывод
"scripts/**" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-инъекции в дефолтах аргументов — идиоматичны, не B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["src/migrations/"]


# Сторонние библиотеки без type-stubs.
[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "slowapi.*"]
ignore_missing_imports = true

# Декораторы Celery (@app.task) нетипизированы — ослабляем только это правило
# для модулей задач, остальной strict сохраняется.
[[tool.mypy.overrides]]
module = ["src.app.tasks.*"]
disallow_untyped_decorators = false
