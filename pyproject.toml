[project]
name = "smenka-back"
version = "0.1.0"
description = "Smenka — API для учёта рабочего времени"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "sqladmin>=0.20.0",
    "httpx>=0.27.0",
    "bcrypt==4.2.1",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "structlog>=24.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99
# Авто-сгенерированные Alembic-миграции не линтуем.
extend-exclude = ["src/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-инъекции в дефолтах аргументов — идиоматичны, не B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["src/migrations/"]

# Сторонние библиотеки без type-stubs.
[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true

# Декораторы Celery (@app.task) нетипизированы — ослабляем только это правило
# для модулей задач, остальной strict сохраняется.
[[tool.mypy.overrides]]
module = ["src.app.tasks.*"]
disallow_untyped_decorators = false
