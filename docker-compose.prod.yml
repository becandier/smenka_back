# Прод-стек целиком. Образы тянутся из ghcr (не собираются здесь).
# Запуск на сервере: docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Отличия от dev docker-compose.yml:
#   - образы из ghcr вместо локальной сборки;
#   - наружу торчит только Caddy (80/443); БД/Redis/API/Admin/Flower — внутренняя сеть;
#   - миграции вынесены в one-shot сервис `migrate` (гонок при старте нет);
#   - Caddy выдаёт TLS (Let's Encrypt) автоматически.
#
# Ресурсные лимиты (deploy.resources) — чтобы один контейнер не утянул весь VPS.
# Числа — стартовые ориентиры; финальные подбираются под размер сервера (DEPLOY_NOTES §4).
# Compose v2 (не Swarm) учитывает deploy.resources.limits при `docker compose up`.
name: smenka

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      # Домен веб-версии мобилки (flutter build web). Должен быть задан в .env.prod.
      WEB_DOMAIN: ${WEB_DOMAIN}
      # Поддомен мониторинга Celery (Flower). Должен быть задан в .env.prod.
      FLOWER_DOMAIN: ${FLOWER_DOMAIN}
      # Корневой домен с лендингом (статика, раздаётся самим Caddy).
      LANDING_DOMAIN: ${LANDING_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Собранная статика лендинга (Astro → dist), кладётся на сервер выкладкой.
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
      - web
      - flower
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  # one-shot: гоняет миграции до старта api/worker, затем выходит
  migrate:
    image: ghcr.io/becandier/smenka_back:${BACK_TAG:-latest}
    restart: "no"
    env_file: .env
    environment:
      PYTHONPATH: /app
    command: alembic -c src/alembic.ini upgrade head
    # Образ несёт HTTP-healthcheck для api; для миграционного one-shot он не нужен
    # (сервис ждут по service_completed_successfully, не по health).
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    image: ghcr.io/becandier/smenka_back:${BACK_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M

  worker:
    image: ghcr.io/becandier/smenka_back:${BACK_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
    # один воркер с встроенным Beat (-B). При горизонтальном масштабировании
    # Beat выносится в отдельный сервис, чтобы расписание не дублировалось.
    # Файл расписания — в /tmp (writable под non-root appuser), не в /app.
    command: celery -A src.app.core.celery_app:celery_app worker -B -l info --scheduler celery.beat:PersistentScheduler --schedule /tmp/celerybeat-schedule
    # Переопределяем HTTP-healthcheck из образа: воркер не слушает HTTP.
    # Авто-завершение смен критично — упавший beat не должен молча «жить».
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.app.core.celery_app:celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  # Мониторинг Celery: очередь, упавшие/зависшие задачи авто-завершения.
  # Наружу — только через Caddy на отдельном поддомене с basic-auth (FLOWER_BASIC_AUTH).
  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555
    environment:
      # Логин/пароль вида user:pass — задаётся в .env.prod (DEPLOY_NOTES §6).
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH}
    expose:
      - "5555"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 64M

  admin:
    image: ghcr.io/becandier/smenka_admin:${ADMIN_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

  # Веб-версия мобилки (flutter build web) — статика за nginx, образ из ghcr
  # (репо smenka_mobile, workflow release-web.yml). Раздаётся Caddy на WEB_DOMAIN
  # через reverse_proxy web:80 (см. infra/caddy/Caddyfile). SPA-fallback — в nginx.conf образа.
  web:
    image: ghcr.io/becandier/smenka_web:${WEB_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
