services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smenka
      POSTGRES_PASSWORD: smenka
      POSTGRES_DB: smenka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smenka"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-совместимое хранилище для локальной разработки. В проде заменяется
  # на managed S3 (см. ../docs/tasks/file_storage/devops.md) — кода это не касается,
  # меняются только S3_* в env.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web-консоль (http://localhost:9001, minioadmin/minioadmin)
    volumes:
      - minio_data:/data
    healthcheck:
      # У некоторых тегов minio нет curl — тогда заменить на проверку через mc-сайдкар.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # one-shot: создаёт бакет и делает его приватным (доступ только через presigned URL бэка).
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/smenka-files &&
      mc anonymous set none local/smenka-files
      "

  api:
    build:
      context: .
      target: app
    command: >
      sh -c "alembic -c src/alembic.ini upgrade head &&
             uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app
      # S3 / file_storage (dev = MinIO). PUBLIC_ENDPOINT — хост в presigned URL,
      # должен быть доступен с устройства клиента (на телефоне — LAN-IP, не localhost).
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: smenka-files
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      S3_PRESIGN_EXPIRE_SECONDS: "3600"
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: .
      target: app
    command: >
      celery -A src.app.core.celery_app:celery_app worker -B -l info
        --scheduler celery.beat:PersistentScheduler
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app
      # S3 / file_storage — worker'у нужно для задачи очистки сирот (cleanup_orphan_files).
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: smenka-files
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
