name: Release

# Пуш в main / тег → собрать образ и запушить в ghcr. Деплой по SSH опционален.
# Намеренно НЕ зависит от CI: образ должен собираться всегда, чтобы деплой был
# предсказуемым. Линт/тесты живут в ci.yml как обратная связь на PR.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/becandier/smenka_back
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Скан ровно того образа, что запушили (по digest, не по плавающему тегу).
      # Сейчас warn-режим (exit-code 0): не блокирует выкладку — политику fail/warn
      # согласуем при первом деплое (DEPLOY_NOTES §9). Для блокировки → exit-code '1'.
      - name: Trivy — скан образа на CVE (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ghcr.io/becandier/smenka_back@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"

      - name: SBOM (SPDX) как артефакт образа
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/becandier/smenka_back@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-smenka_back.spdx.json
          output-file: sbom-smenka_back.spdx.json

  # автодеплой по SSH — выполняется только когда явно включён переменной репозитория
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/smenka && ./scripts/deploy.sh
